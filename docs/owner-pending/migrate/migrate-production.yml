# Owner-pending (docs/owner-actions.md, action 1). Copy to .github/workflows/migrate-production.yml.
# Applies new files in packages/db/migrations to the production database after they reach main, so a deploy never
# runs against missing tables (/api/health 503). Runs only on main, only when a migration file changed (or by hand),
# and only after the owner approves the "production-db" environment, which holds the one secret it uses.
name: migrate-production
on:
  push:
    branches: [main]
    paths: ["packages/db/migrations/**", "packages/db/src/migrat*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migrate-production
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production-db
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @brain/db
      - name: Apply new migrations (each in its own transaction; already applied ones are skipped)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}
        run: |
          test -n "$DATABASE_URL" || { echo "Secret PRODUCTION_DATABASE_URL_DIRECT is not set on the production-db environment"; exit 1; }
          pnpm --filter @brain/db migrate
